# Run EhentaiView without installing Node/pnpm on the host.
# Usage (Linux/macOS/Windows Docker Desktop):
#   cp .env.example .env   # edit EHV_SITE / EHV_PROXY as needed
#   docker compose up --build
# Then open http://localhost:3000
#
# Compose auto-reads `.env` for ${VAR} substitution. Cookies: sign in through
# the app UI in your browser — never put gallery cookies in .env or the image.

services:
  ehv:
    build:
      context: .
      dockerfile: Dockerfile
    image: ehentai-view:revive
    container_name: ehv
    ports:
      - "${EHV_HOST_PORT:-3000}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      EHV_SITE: ${EHV_SITE:-e-hentai}
      EHV_PROXY: ${EHV_PROXY:-}
      EHV_USER_AGENT: ${EHV_USER_AGENT:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8080/api',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
