# Run EhentaiView without installing Node/pnpm on the host.
# Preferred (Windows / no local build):
#   docker load -i ehentai-view-revive.tar.gz   # tag: ehentai-view:revive
#   cp .env.example .env
#   docker compose up -d                        # do NOT pass --build
# Lab/server rebuild only:
#   sudo docker compose build
#   sudo docker save ehentai-view:revive | gzip > ehentai-view-revive.tar.gz
# Then open http://localhost:3000 (or EHV_HOST_PORT from .env if 3000 is taken)
#
# Auth: in-app username/password Sign In. forums.e-hentai.org Cloudflare is
# bypassed via the flaresolverr service (EHV_FLARESOLVERR_URL). Never put
# gallery cookies or passwords in .env or the image.
# Host/browser port = EHV_HOST_PORT (default 3000) → container PORT 8080.

services:
  ehv:
    build:
      context: .
      dockerfile: Dockerfile
    image: ehentai-view:revive
    container_name: ehv
    ports:
      - "${EHV_HOST_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "8080"
      EHV_SITE: ${EHV_SITE:-e-hentai}
      EHV_PROXY: ${EHV_PROXY:-}
      EHV_USER_AGENT: ${EHV_USER_AGENT:-}
      # Same-compose DNS (preferred). Override for an external solver if needed.
      EHV_FLARESOLVERR_URL: ${EHV_FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
      EHV_DOWNLOADS_DIR: /app/data/downloads
    volumes:
      - ${EHV_DOWNLOADS_HOST:-./downloads}:/app/data/downloads
    depends_on:
      - flaresolverr
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8080/api',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Official FlareSolverr (request.get + request.post). Used only for password login.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: ehv-flaresolverr
    environment:
      LOG_LEVEL: info
    ports:
      # Optional host publish for debugging; ehv uses the service name on the compose network.
      - "${EHV_FLARESOLVERR_HOST_PORT:-8191}:8191"
    restart: unless-stopped
