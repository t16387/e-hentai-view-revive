<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Login toolbar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 48px;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #1e1e1e;
        color: #eee;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        box-sizing: border-box;
        border-bottom: 1px solid #333;
        user-select: none;
        -webkit-app-region: no-drag;
      }
      .label {
        font-size: 13px;
        opacity: 0.9;
      }
      button {
        appearance: none;
        border: 1px solid #666;
        background: #333;
        color: #fff;
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        background: #444;
      }
    </style>
  </head>
  <body>
    <div class="label">
      Sign in on forums — solve Cloudflare Turnstile, then cookies are captured
      automatically
    </div>
    <button type="button" id="cancel">Cancel</button>
    <script>
      document.getElementById('cancel').addEventListener('click', () => {
        if (window.toolbarAPI && window.toolbarAPI.cancel) {
          window.toolbarAPI.cancel()
        }
      })
    </script>
  </body>
</html>
